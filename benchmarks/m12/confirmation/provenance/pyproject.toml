[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vrptw-solver"
version = "0.2.0"
description = "A Solomon VRPTW solver with a reproducible integer problem core"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
native = ["pybind11==3.0.1", "setuptools==75.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
